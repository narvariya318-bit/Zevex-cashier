name: Build ZEVEX Cashier APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/zevex/cashier
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle << 'E1'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "ZevexCashier"
          include ':app'
          E1

          cat > build.gradle << 'E2'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          E2

          cat > gradle.properties << 'E3'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          E3

          cat > app/build.gradle << 'E4'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.zevex.cashier'
              compileSdk 34
              defaultConfig {
                  applicationId "com.zevex.cashier"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { debug { debuggable true }; release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          E4

          cat > app/src/main/AndroidManifest.xml << 'E5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="ZEVEX Cashier" android:icon="@android:drawable/sym_def_app_icon" android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".CashierNotificationService" android:exported="true" android:label="ZEVEX Cashier" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService"/>
                      </intent-filter>
                  </service>
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          E5

          cat > app/src/main/res/values/strings.xml << 'E6'
          <resources><string name="app_name">ZEVEX Cashier</string></resources>
          E6

          cat > app/src/main/res/layout/activity_main.xml << 'E7'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:fillViewport="true">
          <LinearLayout android:orientation="vertical" android:padding="20dp" android:layout_width="match_parent" android:layout_height="wrap_content">
              <TextView android:text="ZEVEX Cashier" android:textSize="24sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <TextView android:text="Google Pay / PhonePe Business auto-verify" android:textSize="13sp" android:layout_marginTop="4dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <TextView android:text="API Base URL" android:textStyle="bold" android:layout_marginTop="20dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <EditText android:id="@+id/apiBase" android:hint="https://zevex.in" android:inputType="textUri" android:layout_width="match_parent" android:layout_height="wrap_content"/>
              <TextView android:text="Cashier App" android:textStyle="bold" android:layout_marginTop="14dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <Spinner android:id="@+id/appSel" android:layout_width="match_parent" android:layout_height="wrap_content"/>
              <TextView android:text="Server Code" android:textStyle="bold" android:layout_marginTop="14dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              <EditText android:id="@+id/serverCode" android:inputType="number" android:maxLength="15" android:hint="105906854064" android:layout_width="match_parent" android:layout_height="wrap_content"/>
              <Button android:id="@+id/btnRegister" android:text="Register with Server" android:layout_marginTop="18dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
              <LinearLayout android:id="@+id/appCodeBox" android:orientation="vertical" android:visibility="gone" android:background="#EAF7EE" android:padding="16dp" android:layout_marginTop="24dp" android:layout_width="match_parent" android:layout_height="wrap_content">
                  <TextView android:text="YOUR APP CODE" android:textSize="11sp" android:textStyle="bold" android:textColor="#2E7D46" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <LinearLayout android:orientation="horizontal" android:gravity="center_vertical" android:layout_marginTop="6dp" android:layout_width="match_parent" android:layout_height="wrap_content">
                      <TextView android:id="@+id/appCodeValue" android:textSize="26sp" android:textStyle="bold" android:textColor="#171717" android:layout_weight="1" android:layout_width="0dp" android:layout_height="wrap_content"/>
                      <Button android:id="@+id/btnCopyApp" android:text="COPY" android:textSize="12sp" android:textColor="#FFFFFF" android:backgroundTint="#2E7D46" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  </LinearLayout>
                  <TextView android:text="Website ke modal me paste karke Verify dabao" android:textSize="12sp" android:textColor="#2E7D46" android:layout_marginTop="8dp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              </LinearLayout>
              <Button android:id="@+id/btnPerm" android:text="1. Notification Access Do" android:layout_marginTop="24dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
              <Button android:id="@+id/btnBattery" android:text="2. Battery Optimization Off Karo" android:layout_marginTop="8dp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
              <TextView android:id="@+id/status" android:layout_marginTop="16dp" android:padding="12dp" android:background="#F0F4F8" android:textSize="13sp" android:layout_width="match_parent" android:layout_height="wrap_content"/>
          </LinearLayout>
          </ScrollView>
          E7

          cat > app/src/main/java/com/zevex/cashier/Prefs.kt << 'E8'
          package com.zevex.cashier
          import android.content.Context
          import android.content.SharedPreferences
          class Prefs(ctx: Context) {
              private val sp: SharedPreferences = ctx.getSharedPreferences("zx", Context.MODE_PRIVATE)
              var appCode: String get() = sp.getString("app_code","") ?: ""
                  set(v) { sp.edit().putString("app_code", v).apply() }
              var instanceId: String get() = sp.getString("instance_id","") ?: ""
                  set(v) { sp.edit().putString("instance_id", v).apply() }
              var apiBase: String get() = sp.getString("api_base","https://zevex.in") ?: "https://zevex.in"
                  set(v) { sp.edit().putString("api_base", v).apply() }
              var appSecret: String get() = sp.getString("app_secret","") ?: ""
                  set(v) { sp.edit().putString("app_secret", v).apply() }
              var appType: String get() = sp.getString("app_type","googlepay") ?: "googlepay"
                  set(v) { sp.edit().putString("app_type", v).apply() }
              val isRegistered: Boolean get() = instanceId.isNotEmpty() && appSecret.isNotEmpty()
          }
          E8

          cat > app/src/main/java/com/zevex/cashier/ApiClient.kt << 'E9'
          package com.zevex.cashier
          import okhttp3.FormBody
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.IOException
          import java.util.concurrent.TimeUnit
          import javax.crypto.Mac
          import javax.crypto.spec.SecretKeySpec
          object ApiClient {
              private val client = OkHttpClient.Builder().connectTimeout(15, TimeUnit.SECONDS).readTimeout(20, TimeUnit.SECONDS).build()
              fun hmac(secret: String, data: String): String {
                  val mac = Mac.getInstance("HmacSHA256")
                  mac.init(SecretKeySpec(secret.toByteArray(), "HmacSHA256"))
                  return mac.doFinal(data.toByteArray()).joinToString("") { "%02x".format(it) }
              }
              fun register(base: String, serverCode: String, appType: String, deviceId: String, deviceName: String): JSONObject {
                  val body = FormBody.Builder().add("server_code",serverCode).add("app_type",appType).add("device_id",deviceId).add("device_name",deviceName).build()
                  val req = Request.Builder().url("$base/api/cashier_register.php").post(body).build()
                  client.newCall(req).execute().use { return JSONObject(it.body?.string() ?: "{}") }
              }
              fun sendEvent(prefs: Prefs, amount: Double, utr: String, raw: String): Boolean {
                  val ts = (System.currentTimeMillis()/1000).toString()
                  val amt = String.format("%.2f", amount)
                  val sig = hmac(prefs.appSecret, "${prefs.instanceId}|${prefs.appType}|$amt|$utr|$ts")
                  val body = FormBody.Builder().add("instance",prefs.instanceId).add("app",prefs.appType).add("amount",amt).add("utr",utr).add("ts",ts)
                      .add("device_id", android.os.Build.FINGERPRINT.take(90)).add("raw", raw.take(400)).add("sig", sig).build()
                  val req = Request.Builder().url("${prefs.apiBase}/api/cashier_events.php").post(body).build()
                  return try { client.newCall(req).execute().use { it.isSuccessful } } catch (e: IOException) { false }
              }
          }
          E9

          cat > app/src/main/java/com/zevex/cashier/NotificationParser.kt << 'E10'
          package com.zevex.cashier
          object NotificationParser {
              data class Payment(val amount: Double, val utr: String)
              fun parse(pkg: String, title: String, text: String): Payment? {
                  val full = "$title $text".replace("\n"," ").trim()
                  val recv = listOf("received","you have received","has been received","credited","credit of")
                  if (recv.none { full.contains(it, ignoreCase = true) }) return null
                  if (listOf("sent","debited","transferred to","paid to").any { full.contains(it, ignoreCase = true) } && !full.contains("paid to you", true)) return null
                  val m = Regex("(?:₹|rs\\.?\\s*|inr\\s*)([0-9][0-9,]*\\.?[0-9]*)", RegexOption.IGNORE_CASE).find(full) ?: return null
                  val amount = m.groupValues[1].replace(",","").toDoubleOrNull() ?: return null
                  if (amount <= 0.0) return null
                  var utr = ""
                  val pats = listOf(
                      Regex("(?:utr|rrn|bank\\s*ref(?:erence)?(?:\\s*no\\.?)?)\\s*[:\\-]?\\s*([A-Za-z0-9]{6,30})", RegexOption.IGNORE_CASE),
                      Regex("(?:transaction\\s*id|txn\\s*id|with\\s+id)\\s*[:\\-]?\\s*([A-Za-z0-9]{6,30})", RegexOption.IGNORE_CASE),
                      Regex("\\b(\\d{12})\\b"))
                  for (rx in pats) { val r = rx.find(full); if (r != null) { utr = r.groupValues[1]; break } }
                  return Payment(amount, utr)
              }
          }
          E10

          cat > app/src/main/java/com/zevex/cashier/CashierNotificationService.kt << 'E11'
          package com.zevex.cashier
          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.util.Log
          import kotlin.concurrent.thread
          class CashierNotificationService : NotificationListenerService() {
              private val TAG = "ZXCashier"
              private val pkgMap = mapOf(
                  "com.google.android.apps.nbu.paisa.user" to "googlepay",
                  "com.google.android.apps.nbu.paisa.merchant" to "googlepay",
                  "com.phonepe.app" to "phonepe",
                  "com.phonepe.app.business" to "phonepe",
                  "com.phonepe.app.business.lite" to "phonepe")
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  try {
                      val type = pkgMap[sbn.packageName] ?: return
                      val extras = sbn.notification.extras
                      val title = extras.getString(Notification.EXTRA_TITLE) ?: ""
                      val text = extras.getString(Notification.EXTRA_TEXT) ?: extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                      val prefs = Prefs(this)
                      if (!prefs.isRegistered) return
                      val p = NotificationParser.parse(sbn.packageName, title, text) ?: return
                      Log.i(TAG, "detected [$type] amount=${p.amount} utr=${p.utr}")
                      prefs.appType = type
                      thread { ApiClient.sendEvent(prefs, p.amount, p.utr, "$title | $text") }
                  } catch (e: Exception) { Log.e(TAG, "err", e) }
              }
          }
          E11

          cat > app/src/main/java/com/zevex/cashier/MainActivity.kt << 'E12'
          package com.zevex.cashier
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import kotlin.concurrent.thread
          class MainActivity : AppCompatActivity() {
              private lateinit var prefs: Prefs
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  prefs = Prefs(this)
                  val apiBase = findViewById<EditText>(R.id.apiBase)
                  val appSel = findViewById<Spinner>(R.id.appSel)
                  val codeIn = findViewById<EditText>(R.id.serverCode)
                  val btnReg = findViewById<Button>(R.id.btnRegister)
                  val btnPerm = findViewById<Button>(R.id.btnPerm)
                  val btnBat = findViewById<Button>(R.id.btnBattery)
                  val status = findViewById<TextView>(R.id.status)
                  val appCodeBox = findViewById<LinearLayout>(R.id.appCodeBox)
                  val appCodeValue = findViewById<TextView>(R.id.appCodeValue)
                  val btnCopyApp = findViewById<Button>(R.id.btnCopyApp)
                  apiBase.setText(if (prefs.apiBase.isNotEmpty()) prefs.apiBase else "https://zevex.in")
                  val apps = arrayOf("googlepay","phonepe")
                  appSel.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, apps)
                  appSel.setSelection(apps.indexOf(prefs.appType).coerceAtLeast(0))
                  if (prefs.appCode.isNotEmpty()) { showCode(appCodeBox, appCodeValue, prefs.appCode); status.text = "Registered" }
                  btnCopyApp.setOnClickListener {
                      val c = prefs.appCode
                      if (c.isNotEmpty()) { (getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("App Code", c)); Toast.makeText(this, "App Code copied", Toast.LENGTH_SHORT).show() }
                  }
                  btnPerm.setOnClickListener { try { startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS")) } catch (e: Exception) { startActivity(Intent(Settings.ACTION_SETTINGS)) } }
                  btnBat.setOnClickListener { try { startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)) } catch (e: Exception) { startActivity(Intent(Settings.ACTION_SETTINGS)) } }
                  btnReg.setOnClickListener {
                      val base = apiBase.text.toString().trim().trimEnd('/')
                      if (base.isEmpty() || !base.startsWith("http")) { Toast.makeText(this,"API sahi daalo",Toast.LENGTH_LONG).show(); return@setOnClickListener }
                      val code = codeIn.text.toString().replace(Regex("\\D"),"")
                      val type = apps[appSel.selectedItemPosition]
                      if (code.length != 12) { Toast.makeText(this,"Server code 12 digit",Toast.LENGTH_LONG).show(); return@setOnClickListener }
                      prefs.apiBase = base
                      btnReg.isEnabled = false; btnReg.text = "Registering..."
                      thread {
                          try {
                              val deviceId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: ""
                              val j = ApiClient.register(base, code, type, deviceId, Build.MODEL)
                              runOnUiThread {
                                  btnReg.isEnabled = true; btnReg.text = "Register with Server"
                                  if (j.optBoolean("ok")) {
                                      prefs.appType = type; prefs.appCode = j.optString("app_code")
                                      prefs.instanceId = j.optString("instance_id")
                                      if (j.has("secret")) prefs.appSecret = j.optString("secret")
                                      showCode(appCodeBox, appCodeValue, prefs.appCode)
                                      status.text = "Registered - website pe App Code paste karo aur Verify"
                                  } else Toast.makeText(this, "Error: " + j.optString("msg"), Toast.LENGTH_LONG).show()
                              }
                          } catch (e: Exception) {
                              runOnUiThread { btnReg.isEnabled = true; btnReg.text = "Register with Server"; Toast.makeText(this, "Network error: " + e.message, Toast.LENGTH_LONG).show() }
                          }
                      }
                  }
              }
              private fun showCode(box: LinearLayout, value: TextView, code: String) {
                  box.visibility = View.VISIBLE
                  value.text = code.chunked(3).joinToString(" ")
              }
          }
          E12

          cat > app/src/main/java/com/zevex/cashier/BootReceiver.kt << 'E13'
          package com.zevex.cashier
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) { }
          }
          E13

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zevex-cashier
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
